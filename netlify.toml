[build]
  # O Netlify instala as dependências do package.json antes de rodar o comando
  command = "npm run build && pip install -r requirements.txt && python update_dataset.py && python generate_results.py && python generate_loteca.py"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.11"
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
